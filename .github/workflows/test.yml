name: Test

# Run the Rust tests, the frontend logic tests and the browser tests of the built site on every
# branch except main (main runs all but the browser tests in deploy.yml), so changes are checked
# before they are merged and deployed.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # The same pinned, checksum-verified release as deploy.yml
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Test Rust
        # test-fast: release optimizations without LTO (see Cargo.toml)
        run: cargo test --profile test-fast

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # The newest 24.x, not an older one cached on the runner, so security fixes
          # (such as CVE-2026-111497 in 24.22.1) apply as soon as they are released
          check-latest: true

      - name: Build Wasm
        run: wasm-pack build --target bundler

      - name: Test and build frontend
        working-directory: ./www
        run: |
          npm ci
          node --test "src/**/*.test.ts"
          npx tsc --noEmit
          npm run build

      - name: Check the CDN files against their integrity hashes
        # The browser tests serve them from npm instead, so check what the CDN serves
        working-directory: ./www
        run: node scripts/check-cdn-integrity.mjs

      - name: Browser tests
        # The built site in Chromium, as a phone and a desktop (playwright.config.ts)
        working-directory: ./www
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            www/playwright-report
            www/test-results
          retention-days: 7
