name: Test

# Run the Rust and frontend logic tests on every branch except main (main runs them
# in deploy.yml), so changes are checked before they are merged and deployed.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust
        # test-fast: release optimizations without LTO (see Cargo.toml)
        run: cargo test --profile test-fast

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test frontend logic
        working-directory: ./www
        run: node --test "src/**/*.test.ts"
