name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Prebuilt release from the wasm-bindgen org (wasm-pack moved there from rustwasm),
        # pinned and checksum-verified, instead of compiling it on every deploy
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Rust
        # test-fast: release optimizations without LTO (see Cargo.toml)
        run: cargo test --profile test-fast

      - name: Build Wasm
        run: wasm-pack build --target bundler

      - name: Build Frontend (Vite)
        working-directory: ./www
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
